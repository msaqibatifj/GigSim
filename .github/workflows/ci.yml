name: ci
on: [pull_request, push]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: No secrets in the repo
        run: |
          ! git ls-files | grep -E '(^|/)\.env$'
          ! git grep -nE '(gsk_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{30,}|lsv2_[a-z]+_[A-Za-z0-9]{20,}|BEGIN (RSA|PRIVATE) KEY)' -- . ':!*.lock'
      - name: Nothing under gigsim/ changed
        run: '[ -z "$(git diff --name-only origin/${{ github.base_ref || ''main'' }}...HEAD -- gigsim 2>/dev/null)" ]'
      - name: Every prompt lives in agent/prompts/
        run: '! git grep -nE "(You are|Return JSON)" -- "*.py" ":!agent/llm_fake.py" ":!evals" ":!tests"'
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install uv && uv pip install --system -r pyproject.toml pytest==9.2.0 pytest-asyncio==1.4.1.post1 ruff==0.14.4
      - run: ruff check .
      - name: Unit, integration and contract tests (offline model profile)
        run: python -m pytest -q
        env: {MODEL_PROFILE: offline}
      - name: Report numbers trace to evals/results
        run: python scripts/check_numbers.py
  e2e:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: pip install uv && uv pip install --system -r pyproject.toml
      - run: cd apps/web && npm ci && npm run gen:api && npm run build && npx playwright install --with-deps chromium && npx playwright test
        env: {CI: "1"}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: playwright-report, path: apps/web/playwright-report}
