name: eval
on: [pull_request]
jobs:
  smoke-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install uv && uv pip install --system -r pyproject.toml
      - name: Compact smoke eval (14 dev jobs) then threshold gate; fails if bid F1 or scam recall drop or unsupported claims rise
        run: make smoke-eval
        env: {MODEL_PROFILE: open, GROQ_API_KEY: "${{ secrets.GROQ_API_KEY }}", LANGSMITH_TRACING: "false"}
      - uses: actions/upload-artifact@v4
        with: {name: eval-results, path: evals/results}
