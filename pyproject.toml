[project]
name = "gigbid"
version = "1.0.0"
description = "Agentic freelance bidding assistant: LangGraph + MCP, human approval before anything is sent."
requires-python = ">=3.11"
# Exact pins (resolved and tested on Python 3.14.6, Windows + Linux docker). Mirrored in README "Versions".
dependencies = [
  "langgraph==1.2.20",
  "langgraph-checkpoint-postgres==3.2.0",
  "langgraph-checkpoint-sqlite==3.1.3",
  "langgraph-supervisor==0.0.31",
  "langchain-mcp-adapters==0.3.2",
  "langchain-core==1.7.7",
  "mcp==1.30.0",
  "fastapi==0.162.3",
  "uvicorn==0.54.0",
  "pydantic==2.13.4",
  "psycopg[binary]==3.3.8",
  "redis==5.3.1",
  "arq==0.28.0",
  "qdrant-client==1.20.0",
  "rank-bm25==0.2.2",
  "fastembed==0.9.1",
  "pyyaml==6.0.3",
  "httpx==0.28.1",
  "pypdf==7.0.0",
  "langsmith==0.14.17",
  "cryptography==50.0.2",
  "sqlalchemy==2.1.8",
  "sse-starlette==3.7.0",
  "python-multipart==0.0.33",
  "python-dotenv==1.2.2",
  "numpy==2.4.6",
  "aiosqlite==0.22.1",
]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "ruff==0.14.4"]
data = ["pandas==3.0.3", "openpyxl==3.1.5"]   # only for data/build_market.py (raw Kaggle CSVs)

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "mcp_servers"]

[tool.ruff]
line-length = 160
extend-exclude = ["apps/web", "data/raw"]

[tool.ruff.lint]
select = ["F", "E9", "E4"]   # real errors only; the code base uses compact one-line imports on purpose
ignore = ["E401", "E402"]
